name: Check
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.22.1'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm run format:check
      - run: mkdir -p dist && npm run pack:plugin
      - run: npm install --prefix .runtime/harness --ignore-scripts @deepseek-ai/dsh@0.2.2-rc.1 pnpm@11.22.0
      - run: npm run test:native
        env:
          DSH_TEST_CLI: ${{ github.workspace }}/.runtime/harness/node_modules/.bin/dsh
